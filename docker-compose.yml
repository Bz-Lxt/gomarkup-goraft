services:
  raft-node-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - TZ=Asia/Shanghai
      - RAFT_ID=n1
      - RAFT_HTTP_ADDR=:8080
      - RAFT_ADV_ADDR=raft-node-1:8080
      - RAFT_DATA_DIR=/data
      - RAFT_PEERS=n1=raft-node-1:8080,n2=raft-node-2:8080,n3=raft-node-3:8080,n4=raft-node-4:8080,n5=raft-node-5:8080
      - RAFT_MODE=demo
      - LOG_LEVEL=info
    volumes:
      - node1-data:/data
    ports:
      - "28372:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 8s
    restart: unless-stopped


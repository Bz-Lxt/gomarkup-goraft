      context: ./frontend-user
      dockerfile: Dockerfile
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "28371:80"
    depends_on:
      raft-node-1:
        condition: service_healthy
      raft-node-2:
        condition: service_healthy
      raft-node-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location ~ ^/n1(/.*)$ {
        set $u http://raft-node-1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass $u$1$is_args$args;
    }
    location ~ ^/n2(/.*)$ {
        set $u http://raft-node-2:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass $u$1$is_args$args;
    }
    location ~ ^/n3(/.*)$ {
        set $u http://raft-node-3:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass $u$1$is_args$args;
    }
    location ~ ^/n4(/.*)$ {
        set $u http://raft-node-4:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass $u$1$is_args$args;
    }
    location ~ ^/n5(/.*)$ {
        set $u http://raft-node-5:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass $u$1$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
